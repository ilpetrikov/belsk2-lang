[package]
name = "belsk2-ide"
description = "The Belsk2 IDE"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ilpetrikov/belsk2-lang"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
belsk2 = { path = "../../lang/belsk2" }
belsk2-analysis = { path = "../../lang/analysis" }
belsk2-fmt = { path = "../../lang/fmt" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
