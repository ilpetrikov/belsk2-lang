[workspace]
resolver = "2"
members = ["cli", "lang/syntax", "lang/typeck", "lang/interp", "lang/project", "lang/belsk2", "lang/analysis", "lang/lsp"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ilpetrikov/belsk2-lang"
rust-version = "1.80"

[workspace.dependencies]
belsk2 = { path = "lang/belsk2" }
belsk2-syntax = { path = "lang/syntax" }
belsk2-typeck = { path = "lang/typeck" }
belsk2-interp = { path = "lang/interp" }
belsk2-project = { path = "lang/project" }
belsk2-analysis = { path = "lang/analysis" }
belsk2-lsp = { path = "lang/lsp" }
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
stacker = "0.1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
semver = "1"
clap = { version = "4", features = ["derive"] }

# The whole toolchain is panic-free: every failure is reported as a
# `belsk2::Error`. These lints keep it that way.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
