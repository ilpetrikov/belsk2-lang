[workspace]
resolver = "2"
members = ["cli", "lang/syntax", "lang/typeck", "lang/interp", "lang/belsk2"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ilpetrikov/belsk2-lang"
rust-version = "1.80"

[workspace.dependencies]
belsk2 = { path = "lang/belsk2" }
belsk2-syntax = { path = "lang/syntax" }
belsk2-typeck = { path = "lang/typeck" }
belsk2-interp = { path = "lang/interp" }
stacker = "0.1"
indexmap = "2"
clap = { version = "4", features = ["derive"] }

# The whole toolchain is panic-free: every failure is reported as a
# `belsk2::Error`. These lints keep it that way.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
