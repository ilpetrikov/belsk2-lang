[package]
name = "belsk2-cli"
description = "Command-line tool for the Belsk2 programming language"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "belsk2"
path = "src/main.rs"

[features]
default = ["wasmtime"]
# Runs component projects with `belsk2 run`. Building without it is faster
# and gives a much smaller binary.
wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
belsk2.workspace = true
belsk2-lsp.workspace = true
belsk2-fmt.workspace = true
belsk2-wasm.workspace = true
clap.workspace = true

[lints]
workspace = true
